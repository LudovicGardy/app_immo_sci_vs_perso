# Local run on the Mac. Host port from Apps/__ports_inventory.csv (slot 58), bound to
# 127.0.0.1 and written here, never as ${VAR}. The secrets come from .env (kept out of
# the image, see .dockerignore): the config code falls back on the process environment.
name: app_immo_sci_vs_perso

services:
  app:
    build: .
    ports:
      - "127.0.0.1:8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
      start_interval: 2s
